<!doctype html>
<html lang="en">
	<head>
		<!-- SEO -->
		<link rel="icon" href="/favicon.png" />
		<link rel="canonical" href="https://jordijaspers.dev" />

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="author" content="Jordi Jaspers" />
		<meta
			name="description"
			content="Explore Jordi Jaspers' web portfolio, showcasing years of software development expertise. Connect for your next innovative software solution."
		/>
		<meta name="robots" content="index, follow" />
		<meta property="og:site_name" content="Jordi Jaspers" />

		<!-- Open Graph -->
		<!-- TODO: replace /og-image.png with a 1200x630 social preview asset -->
		<meta property="og:title" content="Jordi Jaspers — Software Engineer" />
		<meta property="og:description" content="Explore Jordi Jaspers' web portfolio, showcasing years of software development expertise. Connect for your next innovative software solution." />
		<meta property="og:image" content="https://jordijaspers.dev/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Jordi Jaspers — Software Engineer" />
		<meta property="og:url" content="https://jordijaspers.dev" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Jordi Jaspers — Software Engineer" />
		<meta name="twitter:description" content="Explore Jordi Jaspers' web portfolio, showcasing years of software development expertise. Connect for your next innovative software solution." />
		<meta name="twitter:image" content="https://jordijaspers.dev/og-image.png" />
		<meta name="twitter:image:alt" content="Jordi Jaspers — Software Engineer" />

		<!-- Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "Person",
					"@id": "https://jordijaspers.dev/#person",
					"name": "Jordi Jaspers",
					"jobTitle": "Software Engineer",
					"url": "https://jordijaspers.dev",
					"image": "https://jordijaspers.dev/og-image.png",
					"sameAs": [
						"https://github.com/jordijaspers",
						"https://www.linkedin.com/in/jordi-jaspers/"
					]
				},
				{
					"@type": "WebSite",
					"@id": "https://jordijaspers.dev/#website",
					"url": "https://jordijaspers.dev",
					"name": "Jordi Jaspers",
					"description": "Personal portfolio of Jordi Jaspers — Software Engineer",
					"inLanguage": "en",
					"publisher": { "@id": "https://jordijaspers.dev/#person" }
				}
			]
		}
		</script>

		<title>Jordi Jaspers</title>
		%sveltekit.head%
	</head>
	<body id="body" data-sveltekit-preload-data="hover" class="bg-background">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
